$("content").innerHTML=`<p class="num">${id}-сабақ · ${x[2]}</p><h2>${x[1]}</h2><div class="notice"><b>Тапсырмалар әзірленуде.</b> Бұл сабақтың нақты интерактивті тесті келесі жаңартуда қосылады. Қазір бұл сабақ үшін жұлдызша есептелмейді.</div><div class="task"><h4>Ойлан және жауап бер</h4><p>«${x[1]}» тақырыбынан не үйрендің? Өз сөзіңмен жаз.</p><textarea rows="4" style="width:100%;padding:12px;border:1px solid #ebe6f2;border-radius:9px" placeholder="Жауабыңды жаз..."></textarea></div>`;
}}
$("back").onclick=()=>{$("detail").classList.remove("show");$("grid").style.display="grid";document.querySelector(".tabs").style.display="flex";$("search").parentElement.style.display="flex";$("listTitle").parentElement.style.display="flex";render()};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");part=b.dataset.part;render()});$("search").oninput=render;$("status").onchange=render;render();
</script></body></html>
